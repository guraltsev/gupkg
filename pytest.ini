[pytest]
testpaths = tests
# The registry checkout has its own tests (run them with gupkg-registry\_scripts\test.cmd).
norecursedirs = gupkg-registry .venv dist .git
# Every test has exactly one tier (_docs/tests.md section 5); the hygiene checks enforce it.
markers =
    unit: only the process itself: fakes of every boundary, small temporary files; no child process, real sleep, network or system-wide state
    process: real child processes, real operating-system objects (links, junctions, registry keys under a test name), loopback servers
    release: builds, unpacks or verifies the shipped product, or runs another repository's checks against this one
