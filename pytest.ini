[pytest]
testpaths = tests
# The registry checkout has its own tests (run them with gupkg-registry\_scripts\test.cmd).
norecursedirs = gupkg-registry _devel .venv dist .git
markers =
    windows_integration: creates real shortcuts, junctions and child processes below pytest temporary directories, or a throwaway HKCU gupkg-test-* registry key (Windows only)
