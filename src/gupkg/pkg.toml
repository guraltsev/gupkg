name = "gupkg"
version = "0.13.3"
localVersion = 0
description = "The standalone gupkg package manager runtime"
homepage = "https://github.com/guraltsev/pkg"

[[environment]]
Name = "GUPKG_HOME"
Value = "$VersionRoot\\gupkg"

[update]

[update.check]
mode = "module"

[update.payload]
mode = "module"
ignore_checksum = true

[[shortcut]]
name = "gupkg manager"
targetPath = "%COMSPEC%"
arguments = '/d /s /c ""$VersionRoot\gupkg\gupkg.cmd" manager tui || pause"'
description = "Run gupkg in manager mode"

[[bin]]
name = "gupkg"
target = "%COMSPEC%"
arguments = ["/d", "/s", "/c", "$VersionRoot\\gupkg\\gupkg.cmd"]
type = "console"
forward_args = true

[[bin]]
name = "gupkg-tui"
target = "%COMSPEC%"
arguments = ["/d", "/s", "/c", "$VersionRoot\\gupkg\\gupkg-tui.cmd"]
type = "console"
forward_args = true
