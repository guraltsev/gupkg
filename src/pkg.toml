format = 2
description = "gupkg package manager"
project_url = "https://github.com/guraltsev/gupkg"
modes = ["system", "user"]

# `gupkg check-updates gupkg` (also `gupkg self check-updates`) runs pkg.local/track.py, which reads the newest
# release from RELEASES.md. The tracker is never copied into a version directory (decision D10).
[track]
provider = "module"
module = "pkg.local/track.py"

# gupkg has no download_url (decision D27): its distribution carries a bundled gupkg in <version>\gupkg\, and this
# populate script copies that tree into App (fetching and verifying the release first when the tree is missing).
[source]
script = "pkg.local/populate.py"
shipped = false

[[shortcut]]
name = "gupkg manager"
target = "%COMSPEC%"
arguments = '/d /s /c ""$App\gupkg-manager.cmd" || pause"'
description = "Manage the packages installed with gupkg"

[[shortcut]]
name = "gupkg manager (administrator)"
target = "%COMSPEC%"
arguments = '/d /s /c ""$App\gupkg-manager.cmd" || pause"'
description = "Manage the packages installed for all users"
run_as_admin = true
modes = ["system"]

# The shims start the bundled Python directly, not a .cmd: Windows runs a .cmd target as `cmd /c "<target>" "a" "b"`, and cmd then
# mangles the arguments (an argument with = , ; or & is split or breaks the command). A .exe target receives every argument
# exactly as the caller typed it. The flags are those of gupkg.cmd; a gupkg-tui / gupkg-manager shim adds the program name first.
[[shim]]
name = "gupkg"
target = "$App\\gupkg\\python\\python.exe"
arguments = ["-I", "-s", "-B", "-S", "$App\\gupkg\\bootstrap.py"]

[[shim]]
name = "gupkg-tui"
target = "$App\\gupkg\\python\\python.exe"
arguments = ["-I", "-s", "-B", "-S", "$App\\gupkg\\bootstrap.py", "--gupkg-program=tui"]

[[shim]]
name = "gupkg-manager"
target = "$App\\gupkg\\python\\python.exe"
arguments = ["-I", "-s", "-B", "-S", "$App\\gupkg\\bootstrap.py", "--gupkg-program=manager"]
