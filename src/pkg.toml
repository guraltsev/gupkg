name = "gupkg"
version = "0.12.1"
localVersion = 0
description = "The standalone gupkg package manager runtime"
homepage = "https://github.com/guraltsev/pkg"


[[shortcut]]
name = "gupkg manager"
targetPath = "%COMSPEC%"
arguments = '/d /s /c ""$VersionRoot\gupkg\gupkg.cmd" manager tui"'
description = "Run gupkg in manager mode"

[[bin]]
name = "gupkg"
target = "%COMSPEC%"
arguments = ["/d", "/s", "/c", "$VersionRoot\\gupkg\\gupkg.cmd"]
type = "console"
forward_args = true

[[bin]]
name = "gupkg-tui"
target = "%COMSPEC%"
arguments = ["/d", "/s", "/c", "$VersionRoot\\gupkg\\gupkg-tui.cmd"]
type = "console"
forward_args = true
