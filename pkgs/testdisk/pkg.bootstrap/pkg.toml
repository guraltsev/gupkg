name = "testdisk"
version = "bootstrap"
localVersion = 0
only_portable = false
description = "Data recovery tools for lost partitions and deleted files."
homepage = "https://www.cgsecurity.org/"

[update]

[update.check]
mode = "module"

[update.payload]
mode = "zip"
# The publisher provides no checksum for this release asset.
ignore_checksum = true

[[update.payload.extract]]
src = "testdisk-*/"
dest = ""

[[shortcut]]
name = "TestDisk"
targetPath = "$App\\testdisk_win.exe"
description = "Partition and data recovery"

[[shortcut]]
name = "PhotoRec"
targetPath = "$App\\qphotorec_win.exe"
description = "File carving recovery"

[[bin]]
name = "testdisk"
target = "$App\\testdisk_win.exe"

[[bin]]
name = "photorec"
target = "$App\\photorec_win.exe"
