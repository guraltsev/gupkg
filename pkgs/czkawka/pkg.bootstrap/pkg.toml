name = "czkawka"
version = "bootstrap"
localVersion = 0
only_portable = false
description = "Finds duplicate files, empty folders, similar images, and more."
homepage = "https://github.com/qarmin/czkawka"

[origin]
url = "https://github.com/qarmin/czkawka"

[update]

[update.check]
mode = "github"
assetName = "windows_czkawka_gui_gtk_412.zip"

[update.payload]
mode = "zip"

[[shortcut]]
name = "Czkawka"
targetPath = "$App\\czkawka_gui.exe"
description = "Duplicate and clutter finder"

[[shortcut]]
name = "Krokiet"
targetPath = "$App\\krokiet.exe"
description = "Czkawka with the Krokiet interface"

[[bin]]
name = "czkawka_cli"
target = "$App\\czkawka_cli.exe"
