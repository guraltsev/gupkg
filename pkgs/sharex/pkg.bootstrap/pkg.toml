name = "sharex"
version = "bootstrap"
localVersion = 0
only_portable = false
description = "Screen capture, recording, and file-sharing tool."
homepage = "https://getsharex.com/"

[origin]
url = "https://github.com/ShareX/ShareX"

[update]

[update.check]
mode = "github"
