name = "npbackup"
version = "bootstrap"
localVersion = 0
only_portable = false
description = "Secure, efficient file backup built on restic with a GUI for end users and a CLI for administrators."
homepage = "https://github.com/netinvent/npbackup"

[origin]
url = "https://github.com/netinvent/npbackup"

[update]

[update.check]
mode = "github"
assetName = "npbackup-windows-x64-gui-public.zip"

[update.payload]
mode = "zip"
extractSubdir = "npbackup-gui"

[[shortcut]]
name = "NPbackup"
targetPath = "$App\\npbackup-gui.exe"
workingDirectory = "$App"
description = "Backup system based on restic"
