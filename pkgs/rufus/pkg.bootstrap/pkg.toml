name = "rufus"
version = "bootstrap"
localVersion = 0
only_portable = false
description = "Creates bootable USB drives."
homepage = "https://rufus.ie/"

[origin]
url = "https://github.com/pbatard/rufus"

[update]

[update.check]
mode = "github"
assetName = "rufus-${version}p.exe"

[update.payload]
mode = "zip"

[[update.payload.rename]]
src = "rufus-${version}p.exe"
dest = "rufus.exe"

[[shortcut]]
name = "Tools\\Rufus"
targetPath = "$App\\rufus.exe"
description = "Bootable USB creator"
