name = "graphviz"
version = "bootstrap"
localVersion = 0
only_portable = false
description = "Graph visualization software (dot and related layout tools)."
homepage = "https://graphviz.org/"

[update]

[update.check]
mode = "module"

[update.payload]
mode = "zip"
# The publisher provides no checksum for this release asset.
ignore_checksum = true

[[update.payload.extract]]
src = "Graphviz-*/"
dest = ""

[[path]]
value = "$App\\bin"
