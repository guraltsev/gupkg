name = "python"
version = "bootstrap"
localVersion = 0
only_portable = false
description = "Python programming language, official embeddable distribution for 64-bit Windows."
homepage = "https://www.python.org/"

[update]

[update.check]
mode = "module"

[update.payload]
mode = "zip"
# python.org publishes signatures, not checksums, for the embeddable ZIP.
ignore_checksum = true

[[path]]
value = "$App"

[[path]]
value = "$App\\Scripts"

[[shortcut]]
name = "Python"
targetPath = "$App\\python.exe"
workingDirectory = "%USERPROFILE%"
description = "Python interactive interpreter"

[[bin]]
name = "python"
target = "$App\\python.exe"

[[bin]]
name = "pythonw"
target = "$App\\pythonw.exe"
type = "gui"
