name = "winmerge"
version = "bootstrap"
localVersion = 0
only_portable = false
description = "Visual file and folder comparison and merge tool."
homepage = "https://winmerge.org/"

[origin]
url = "https://github.com/WinMerge/winmerge"

[update]

[update.check]
mode = "github"
assetName = "winmerge-${version}-x64-exe.zip"

[update.payload]
mode = "zip"

[[update.payload.extract]]
src = "WinMerge/"
dest = ""

[[shortcut]]
name = "WinMerge"
targetPath = "$App\\WinMergeU.exe"
description = "File and folder comparison"

[[bin]]
name = "winmerge"
target = "$App\\WinMergeU.exe"
type = "gui"
