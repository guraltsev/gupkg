name = "nano"
version = "bootstrap"
localVersion = 0
only_portable = false
description = "Small, friendly command-line text editor."
homepage = "https://www.nano-editor.org/"

[origin]
url = "https://github.com/okibcn/nano-for-windows"

[update]

[update.check]
mode = "github"
assetName = "nano-for-windows_win64_v${version}.zip"

[update.payload]
mode = "module"
# The publisher provides no checksum for this release asset.
ignore_checksum = true

[[path]]
value = "$App"

[[bin]]
name = "nano"
target = "$App\\nano.exe"
