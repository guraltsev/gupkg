name = "crystaldiskmark"
version = "bootstrap"
localVersion = 0
only_portable = false
description = "Disk benchmark utility."
homepage = "https://crystalmark.info/"

[update]

[update.check]
mode = "module"

[update.payload]
mode = "zip"
# The publisher provides no checksum for this release asset.
ignore_checksum = true

[[shortcut]]
name = "Tools\\CrystalDiskMark"
targetPath = "$App\\DiskMark64.exe"
description = "CrystalDiskMark"
