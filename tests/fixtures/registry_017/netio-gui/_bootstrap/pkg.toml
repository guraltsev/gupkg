only_portable = false
description = "Windows front end for the netio network benchmark."
homepage = "https://sourceforge.net/projects/netiogui/"

[update]

[update.check]
mode = "module"

[update.payload]
mode = "zip"
# SourceForge publishes only MD5 digests for this project.
ignore_checksum = true

[[shortcut]]
name = "NetIO-GUI"
targetPath = "$App\\NetIO.App.exe"
workingDirectory = "$App"
description = "Network throughput benchmark"
