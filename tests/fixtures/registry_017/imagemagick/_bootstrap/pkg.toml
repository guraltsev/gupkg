only_portable = false
description = "Command-line suite for creating, converting, and editing images."
homepage = "https://imagemagick.org/"

[origin]
url = "https://github.com/ImageMagick/ImageMagick"

[update]

[update.check]
mode = "github"
assetName = "ImageMagick-${version}-portable-Q16-HDRI-x64.7z"

[update.payload]
mode = "module"

[[path]]
value = "$App"

[[bin]]
name = "magick"
target = "$App\\magick.exe"
