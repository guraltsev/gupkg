only_portable = false
description = "Graphical front end for smartctl hard disk health checks."
homepage = "https://gsmartcontrol.shaduri.dev/"

[origin]
url = "https://github.com/ashaduri/gsmartcontrol"

[update]

[update.check]
mode = "github"
assetName = "gsmartcontrol-${version}-win64.zip"

[update.payload]
mode = "zip"
# The publisher provides no checksum for this release asset.
ignore_checksum = true

[[update.payload.extract]]
src = "gsmartcontrol-*/"
dest = ""

[[shortcut]]
name = "GSmartControl"
targetPath = "$App\\gsmartcontrol.exe"
description = "Disk S.M.A.R.T. health viewer"
