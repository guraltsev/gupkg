only_portable = false
description = "High-performance dynamic programming language for technical computing."
homepage = "https://julialang.org/"

[update]

[update.check]
mode = "module"

[update.payload]
mode = "zip"
ignore_checksum = false

# The ZIP holds a single julia-<version> folder; App receives its contents.
[[update.payload.extract]]
src = "julia-*/"
dest = ""

[[path]]
value = "$App\\bin"

[[shortcut]]
name = "Julia"
targetPath = "$App\\bin\\julia.exe"
workingDirectory = "%USERPROFILE%"
description = "Julia REPL"

[[bin]]
name = "julia"
target = "$App\\bin\\julia.exe"
