only_portable = false
description = "Handwriting notetaking and PDF annotation app."
homepage = "https://xournalpp.github.io/"

[origin]
url = "https://github.com/xournalpp/xournalpp"

[update]

[update.check]
mode = "github"
assetName = "xournalpp-${version}-windows-portable-AMD64.zip"

[update.payload]
mode = "zip"

[[update.payload.extract]]
src = "xournalpp-*/"
dest = ""

[[shortcut]]
name = "Xournal++"
targetPath = "$App\\bin\\xournalpp.exe"
description = "Handwritten notes and PDF annotation"

[[bin]]
name = "xournalpp"
target = "$App\\bin\\xournalpp.exe"
type = "gui"
