only_portable = false
description = "Image and photo editing software."
homepage = "https://www.getpaint.net/"

[origin]
url = "https://github.com/paintdotnet/release"

[update]

[update.check]
mode = "github"
assetName = "paint.net.${version}.portable.x64.zip"

[update.payload]
mode = "zip"

[[shortcut]]
name = "Paint.NET"
targetPath = "$App\\paintdotnet.exe"
description = "Image and photo editor"
