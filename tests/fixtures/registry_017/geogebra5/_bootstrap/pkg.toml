only_portable = false
description = "Dynamic mathematics software, Classic 5 edition."
homepage = "https://www.geogebra.org/"

[update]

[update.check]
mode = "module"

[update.payload]
mode = "zip"
# The publisher provides no checksum for this release asset.
ignore_checksum = true

[[update.payload.extract]]
src = "GeoGebra */"
dest = ""

[[shortcut]]
name = "GeoGebra Classic 5"
targetPath = "$App\\GeoGebra.exe"
description = "Dynamic mathematics software"
