format = 2
description = "Source code and text editor."
project_url = "https://notepad-plus-plus.org/"
modes = ["system", "user"]

[track]
provider = "github"
repo = "notepad-plus-plus/notepad-plus-plus"
asset = "npp.${version}.portable.x64.zip"

[source]
download_url = "${asset_url}"
require = ["notepad++.exe"]

[[shortcut]]
name = "Notepad++"
target = "$App\\notepad++.exe"
description = "Text and source code editor"

[[shim]]
name = "notepad++"
target = "$App\\notepad++.exe"
type = "gui"
