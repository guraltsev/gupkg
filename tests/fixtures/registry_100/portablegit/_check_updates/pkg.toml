format = 2
description = "Git for Windows portable distribution with Git Bash and the MSYS2 tool set."
project_url = "https://gitforwindows.org/"
modes = ["system", "user"]

# Tags look like v2.46.2.windows.1; the asset name carries the version (with the rebuild number for rebuilds).
[track]
provider = "github"
repo = "git-for-windows/git"
version_from = "asset"
asset_pattern = 'PortableGit-(?P<version>\d+(?:\.\d+)*)-64-bit\.7z\.exe'

# The GitHub asset digest is the checksum (found by the github provider).
# The 7-Zip self-extractor is unpacked by the built-in service, never run.
[source]
download_url = "${asset_url}"

[[path]]
value = "$App\\cmd"

[[path]]
value = "$App\\bin"

[[shim]]
name = "diff"
target = "$App\\usr\\bin\\diff.exe"

[[shortcut]]
name = "Git bash"
target = "$App\\git-bash.exe"
working_dir = "%USERPROFILE%"
description = "Git Bash terminal"