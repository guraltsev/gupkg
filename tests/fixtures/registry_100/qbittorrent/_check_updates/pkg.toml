format = 2
description = "An advanced and multi-platform BitTorrent client with a nice Qt user interface as well as a Web UI for remote control and an integrated search engine. qBittorrent aims to meet the needs of most users while using as little CPU and memory as possible."
project_url = "https://www.qbittorrent.org/"
modes = ["system", "user"]

# SourceForge's platform metadata names the Windows installer (the generic latest URL redirects to a source archive).
[track]
provider = "json"
check_url = "https://sourceforge.net/projects/qbittorrent/best_release.json"
version = "$.platform_releases.windows.filename"
match = 'qbittorrent_(?P<version>\d+(?:\.\d+)*)_x64_setup\.exe'

[track.captures]
filename = "$.platform_releases.windows.filename"

# SourceForge publishes no checksum: no [source.checksum]. The NSIS installer is unpacked by 7-Zip, never run.
[source]
download_url = "https://sourceforge.net/projects/qbittorrent/files${filename}/download"
kind = "nsis"

[[shortcut]]
name = "Qbittorrent"
target = "$App\\qbittorrent.exe"
description = "Torrent client"