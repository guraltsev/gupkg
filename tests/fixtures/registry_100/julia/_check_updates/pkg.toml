format = 2
description = "High-performance dynamic programming language for technical computing."
project_url = "https://julialang.org/"
modes = ["system", "user"]

# Stable releases only; the win64 ZIP and its SHA-256 come from the same index entry.
[track]
provider = "json"
check_url = "https://julialang-s3.julialang.org/bin/versions.json"
records = "$.*"
filter = ["stable==true", '~ =~ \d+\.\d+\.\d+']
version = "~"
download = "files[?os==winnt && arch==x86_64 && kind==archive && extension==zip].url"
checksum = "files[?os==winnt && arch==x86_64 && kind==archive && extension==zip].sha256"

# The ZIP holds a single julia-<version> folder; App receives its contents.
[source]
download_url = "${download_url}"
strip = 1

[[path]]
value = "$App\\bin"

[[shim]]
name = "julia"
target = "$App\\bin\\julia.exe"

[[shortcut]]
name = "Julia"
target = "$App\\bin\\julia.exe"
working_dir = "%USERPROFILE%"
description = "Julia REPL"