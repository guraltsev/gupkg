format = 2
description = "Free SFTP, SCP, FTP, and WebDAV client."
project_url = "https://winscp.net/"
modes = ["system", "user"]

# The download page names the portable ZIP; the file's own page then issues a short-lived mirror link.
[track]
provider = "chain"
download = "${download_url}"

[[track.fetch]]
url = "https://winscp.net/eng/downloads.php"
match = 'WinSCP-(?P<version>\d+(?:\.\d+)+)-Portable\.zip\b(?!-)'
headers = { User-Agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) gupkg-update-check/1", Accept = "text/html,application/xhtml+xml,*/*" }

[[track.fetch]]
url = "https://winscp.net/download/WinSCP-${version}-Portable.zip/download"
match = 'href="(?P<download_url>https://cdn\.winscp\.net/files/WinSCP-${version}-Portable\.zip\?[^"]+)"'
headers = { User-Agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) gupkg-update-check/1", Accept = "text/html,application/xhtml+xml,*/*" }

# The publisher provides no checksum in a machine-readable place: no [source.checksum].
[source]
download_url = "${download_url}"

[[shortcut]]
name = "WinSCP"
target = "$App\\WinSCP.exe"
description = "SFTP and FTP client"