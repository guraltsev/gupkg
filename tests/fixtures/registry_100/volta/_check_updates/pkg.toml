format = 2
description = "Hassle-free JavaScript tool manager that pins node, npm, pnpm, and yarn per project."
project_url = "https://volta.sh/"
modes = ["system", "user"]

[track]
provider = "github"
repo = "volta-cli/volta"
asset = "volta-${version}-windows.zip"

# The GitHub asset digest is the checksum (found by the github provider).
[source]
download_url = "${asset_url}"
require = ["volta.exe", "volta-shim.exe"]

# What `volta setup` does on Windows: volta-shim.exe dispatches on the name it is launched as,
# so each tool gets its own byte-for-byte copy.
[[prepare]]
copy = { from = "volta-shim.exe", to = ["node.exe", "npm.exe", "npx.exe", "pnpm.exe", "yarn.exe"] }

# Volta keeps each user's tool shims (every tool installed with `volta install`, such as tsc) in %LOCALAPPDATA%\Volta\bin. That
# folder differs for every user, so the machine PATH cannot name it and no PATH entry is declared here. The commands below work for
# every user as they are; to have the tools you install with Volta on your PATH, run `volta setup` once as that user.
[[shim]]
name = "volta"
target = "$App\\volta.exe"

[[shim]]
name = "node"
target = "$App\\node.exe"

[[shim]]
name = "npm"
target = "$App\\npm.exe"

[[shim]]
name = "npx"
target = "$App\\npx.exe"

[[shim]]
name = "pnpm"
target = "$App\\pnpm.exe"

[[shim]]
name = "yarn"
target = "$App\\yarn.exe"
