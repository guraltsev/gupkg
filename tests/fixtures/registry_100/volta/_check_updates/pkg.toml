format = 2
description = "Hassle-free JavaScript tool manager that pins node, npm, pnpm, and yarn per project."
project_url = "https://volta.sh/"
modes = ["system", "user"]

[track]
provider = "github"
repo = "volta-cli/volta"
asset = "volta-${version}-windows.zip"

# The GitHub asset digest is the checksum (found by the github provider).
[source]
download_url = "${asset_url}"
require = ["volta.exe", "volta-shim.exe"]

# What `volta setup` does on Windows: volta-shim.exe dispatches on the name it is launched as,
# so each tool gets its own byte-for-byte copy.
[[prepare]]
copy = { from = "volta-shim.exe", to = ["node.exe", "npm.exe", "npx.exe", "pnpm.exe", "yarn.exe"] }

# volta-shim.exe copies named node.exe, npm.exe, ... sit in App, and on Windows Volta looks for its shims in the folder it is installed
# in, so App itself is on the PATH. Do not shim node, npm, npx, pnpm or yarn into another folder on the PATH: a copy finds the real tool
# by searching the PATH, finds that shim, and starts itself again without end. Volta keeps each user's tool shims for tools
# installed with `volta install` (such as tsc) in %LOCALAPPDATA%\Volta\bin. That folder differs for every user, so the machine PATH
# cannot name it and no entry is declared here; each user runs `volta setup` once to add it, then `volta install node`.
[[path]]
value = "$App"

[[shim]]
name = "volta"
target = "$App\\volta.exe"
