format = 2
description = "7-Zip is a file archiver with a high compression ratio."
project_url = "https://www.7-zip.org/"
modes = ["system", "user"]

[track]
provider = "page"
check_url = "https://www.7-zip.org/"
match = '(?i)Download\s+7-Zip\s+(?P<version>\d+(?:\.\d+)+)\s*\([^)]{0,40}\)\s*for\s+Windows[^<>x]{0,20}(?:<[^>]{1,40}>[^<>x]{0,20}){0,2}x64'
# The 0.17 hook took the announced x64 release and the page's own `7z<digits>-x64.exe` link. 7-Zip names
# that file after the version without its dot (24.09 -> 7z2409-x64.exe), so the address is built from the
# announced version: the same artifact, and it can never pick the 32-bit or ARM64 link.
download = "https://www.7-zip.org/a/7z${version|nodots}-x64.exe"

[source]
download_url = "${download_url}"
require = ["7z.exe", "7zFM.exe"]

[[shim]]
name = "7z"
target = "$App\\7z.exe"
working_dir = "$App"

[[shortcut]]
name = "7-Zip File Manager"
target = "$App\\7zFM.exe"
working_dir = "$App"
description = "7-Zip File Manager"
