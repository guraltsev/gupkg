format = 2
description = "Advanced task manager showing handles and DLLs per process."
project_url = "https://learn.microsoft.com/sysinternals/"
modes = ["system", "user"]

# Sysinternals publishes one unversioned ZIP: its modification date is the version.
[track]
provider = "last_modified"
check_url = "https://download.sysinternals.com/files/ProcessExplorer.zip"
format = "%Y%m%d"

# The publisher provides no checksum: no [source.checksum].
[source]
download_url = "https://download.sysinternals.com/files/ProcessExplorer.zip"

[[shortcut]]
name = "Tools\\Process Explorer"
target = "$App\\procexp64.exe"
description = "Advanced task manager showing handles and DLLs per process."