format = 2
description = "Visual Studio Code editor with debugging, tasks, and version-control integration."
project_url = "https://code.visualstudio.com/"
modes = ["system", "user"]

# The stable channel API lists versions newest first.
[track]
provider = "json"
check_url = "https://update.code.visualstudio.com/api/releases/stable"
version = "$[0]"

# Microsoft publishes no digest at a version-addressable place: no [source.checksum].
[source]
download_url = "https://update.code.visualstudio.com/${version}/win32-x64-archive/stable"

[[shortcut]]
name = "VSCode"
target = "$App\\Code.exe"
description = "Visual Studio Code"

[[shim]]
name = "code"
target = "$App\\Code.exe"
type = "gui"