format = 2
description = "Windows front end for the netio network benchmark."
project_url = "https://sourceforge.net/projects/netiogui/"
modes = ["system", "user"]

[track]
provider = "rss"
check_url = "https://sourceforge.net/projects/netiogui/rss?path=/"
match = '/(?P<name>netio-gui_v(?P<version>\d+(?:\.\d+)*)_portable\.zip)'
download = "https://sourceforge.net/projects/netiogui/files/${name}/download"

# SourceForge rejects non-browser clients for the feed only; downloads use the default one.
[track.headers]
User-Agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36"

# SourceForge publishes only MD5 digests for this project: no [source.checksum].
[source]
download_url = "${download_url}"

[[shortcut]]
name = "NetIO-GUI"
target = "$App\\NetIO.App.exe"
working_dir = "$App"
description = "Network throughput benchmark"