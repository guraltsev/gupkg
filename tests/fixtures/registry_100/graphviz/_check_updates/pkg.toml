format = 2
description = "Graph visualization software."
project_url = "https://graphviz.org/"
modes = ["system", "user"]

[track]
provider = "page"
check_url = "https://graphviz.org/download/"
match = 'graphviz-releases/(?P<version>\d+(?:\.\d+)+)/windows_10_cmake_Release_Graphviz-(?P=version)-win64\.zip'
download = "https://gitlab.com/api/v4/projects/4207231/packages/generic/graphviz-releases/${version}/windows_10_cmake_Release_Graphviz-${version}-win64.zip"

[track.headers]
User-Agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) gupkg-update-check/1"
Accept = "text/html,application/xhtml+xml,*/*"

[source]
download_url = "${download_url}"
strip = "auto"
require = ["bin\\dot.exe"]

[[path]]
value = "$App\\bin"
