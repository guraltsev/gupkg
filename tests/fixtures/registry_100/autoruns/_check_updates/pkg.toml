format = 2
description = "Shows what runs automatically at startup and logon."
project_url = "https://learn.microsoft.com/sysinternals/"
modes = ["system", "user"]

# Sysinternals publishes one unversioned ZIP: its modification date is the version.
[track]
provider = "last_modified"
check_url = "https://download.sysinternals.com/files/Autoruns.zip"
format = "%Y%m%d"

# The publisher provides no checksum: no [source.checksum].
[source]
download_url = "https://download.sysinternals.com/files/Autoruns.zip"

[[shortcut]]
name = "Tools\\Autoruns"
target = "$App\\Autoruns64.exe"
description = "Shows what runs automatically at startup and logon."