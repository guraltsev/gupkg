format = 2
description = "Keyboard-driven launcher and command palette."
project_url = "https://keypirinha.com/"
modes = ["system", "user"]

# The publisher provides no checksum beyond GitHub's asset digest.
[track]
provider = "github"
repo = "Keypirinha/Keypirinha"
asset = "keypirinha-${version}-x64-portable.7z"

[source]
download_url = "${asset_url}"
strip = "auto"

# The release ships a "portable" folder that puts Keypirinha in portable mode; it is removed so the profile
# stays outside the versioned App (the 0.17 unpack hook did this unconditionally).
[[prepare]]
remove = ["portable"]

[[shortcut]]
name = "Keypirinha"
target = "$App\\keypirinha.exe"
description = "Launcher"
