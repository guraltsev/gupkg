format = 2
description = "Preservation-focused command-line transformations for LaTeX source."
project_url = "https://github.com/guraltsev/latex-toolkit"
modes = ["system", "user"]

[track]
provider = "git"
repo_url = "git@github.com:guraltsev/latex-toolkit.git"

[source]
download_url = "git@github.com:guraltsev/latex-toolkit.git"
kind = "git"

[source.git]
commit = "${commit}"

[[shim]]
name = "lt_brace_args"
target = "%COMSPEC%"
arguments = ["/d", "/c", "$App\\src\\lt_brace_args.cmd"]

[[shim]]
name = "lt_eqnum_label"
target = "%COMSPEC%"
arguments = ["/d", "/c", "$App\\src\\lt_eqnum_label.cmd"]

[[shim]]
name = "lt_full_normalize"
target = "%COMSPEC%"
arguments = ["/d", "/c", "$App\\src\\lt_full_normalize.cmd"]

