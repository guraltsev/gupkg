format = 2
description = "Pidgin multi-protocol instant messaging client, unpacked from the offline installer."
project_url = "https://pidgin.im/"
modes = ["system", "user"]

[track]
provider = "index"
check_url = "https://sourceforge.net/projects/pidgin/files/Pidgin/"
download = "https://sourceforge.net/projects/pidgin/files/Pidgin/${version}/${file}/download"

[[track.level]]
match = '/Pidgin/(?P<version>\d+(?:\.\d+)+)/'
select = "max"
next = "${version}/"

[[track.level]]
match = '/Pidgin/${version}/(?P<file>pidgin-${version}-offline\.exe)/download'

# SourceForge publishes no checksum next to the installer: no [source.checksum].
[source]
download_url = "${download_url}"
kind = "nsis"

# The offline installer holds the GTK runtime as gtk.zip (it contains a top-level Gtk folder).
[[source.nested]]
path = "$PLUGINSDIR/gtk.zip"
dest = ""

[[prepare]]
remove = ["$PLUGINSDIR", "pidgin-uninst.exe"]

[[shortcut]]
name = "Pidgin"
target = "$App\\pidgin.exe"
working_dir = "$App"
description = "Pidgin instant messenger"