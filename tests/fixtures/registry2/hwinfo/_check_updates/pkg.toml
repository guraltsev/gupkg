format = 2
description = "System information and hardware monitoring tool."
project_url = "https://www.hwinfo.com/"

[track]
provider = "page"
check_url = "https://www.hwinfo.com/download/"
match = 'href="(?P<href>https://www\.hwinfo\.com/files/hwi_(?P<major>\d+?)(?P<minor>\d{2})\.zip)"[^>]*>\s*Local \(U\.S\.\)'
version = "${major}.${minor}"
download = "${href}"

[track.headers]
User-Agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) gupkg-update-check/1"

[source]
download_url = "${download_url}"

[source.headers]
User-Agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/124 Safari/537.36"
Referer = "https://www.hwinfo.com/download/"
