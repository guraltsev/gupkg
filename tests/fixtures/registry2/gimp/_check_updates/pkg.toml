format = 2
description = "GNU Image Manipulation Program."
project_url = "https://www.gimp.org/"

[track]
provider = "index"
check_url = "https://download.gimp.org/gimp/"
download = "https://download.gimp.org/gimp/v${major}.${minor}/gimp-${version}-setup.exe"

[[track.level]]
match = 'href="v(?P<major>\d+)\.(?P<minor>\d+)/"'
key = "${major}.${minor}"
next = "v${major}.${minor}/"

[[track.level]]
match = 'href="gimp-(?P<version>\d+(?:\.\d+)*)-setup\.exe"'

[source]
download_url = "${download_url}"
kind = "exe"
