format = 2
description = "NetIO-GUI."
project_url = "https://sourceforge.net/projects/netiogui/"

[track]
provider = "rss"
check_url = "https://sourceforge.net/projects/netiogui/rss?path=/"
match = '/(?P<name>netio-gui_v(?P<version>\d+(?:\.\d+)*)_portable\.zip)'
download = "https://sourceforge.net/projects/netiogui/files/${name}/download"

[track.headers]
User-Agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36"

[source]
download_url = "${download_url}"
