format = 2
description = "qBittorrent BitTorrent client."
project_url = "https://www.qbittorrent.org/"

[track]
provider = "json"
check_url = "https://sourceforge.net/projects/qbittorrent/best_release.json"
version = "$.platform_releases.windows.filename"
match = 'qbittorrent_(?P<version>\d+(?:\.\d+)*)_x64_setup\.exe'

[track.captures]
filename = "$.platform_releases.windows.filename"

[source]
download_url = "https://sourceforge.net/projects/qbittorrent/files${filename}/download"
kind = "nsis"
